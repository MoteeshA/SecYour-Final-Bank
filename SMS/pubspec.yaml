name: sms
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ✅ SMS reading
  telephony: ^0.2.0

  # ✅ Store hidden/deleted messages
  shared_preferences: ^2.2.3

  # ✅ Call OpenAI HTTP API
  http: ^1.2.0

  # ✅ Text-to-speech for Odia explanation
  flutter_tts: ^3.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
